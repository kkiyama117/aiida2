[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-slurm-rsc"
version = "0.1.0"
description = "AiiDA Slurm scheduler plugin for KUDPC Camphor (sp): emits the custom --rsc resource spec instead of forbidden standard options"
requires-python = ">=3.10"
dependencies = ["aiida-core>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."aiida.schedulers"]
slurm_rsc = "aiida_slurm_rsc.scheduler:SlurmRscScheduler"

[tool.setuptools.packages.find]
include = ["aiida_slurm_rsc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
