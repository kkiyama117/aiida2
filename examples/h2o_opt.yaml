# One H2O geometry optimisation, B3LYP/6-31G(d).
# Submit with:
#   ./run.py attach python3 tools/submit.py examples/h2o_opt.yaml --dry-run
code: g16@sp
structure: examples/h2o.xyz
charge: 0
multiplicity: 1

functional: B3LYP
basis_set: 6-31G(d)
route_parameters:
  opt: null

resources:
  num_machines: 1
  num_mpiprocs_per_machine: 1
  num_cores_per_mpiproc: 4
memory_gb: 4
max_wallclock_seconds: 1800
queue: gr10641a # optional; falls back to the computer's default_queue
mail: default # default | terminal | none | [BEGIN, END]
