# Extra Apptainer bind mounts, appended by run.py for up/shell/attach alike.
# Copy to config/binds.conf (git-ignored); one src:dst[:ro] per line,
# '#' comments, '~' expands.  A missing src makes run.py fail loudly.
# No file means no extra mounts -- the default session carries no credentials.

# ssh material for the remote computer, individual read-only files.
# The host key must already be registered in your ~/.ssh/known_hosts;
# AiiDA's default RejectPolicy is not weakened.
# ~/.ssh/id_kudpc:/home/aiida/.ssh/id_kudpc:ro
# ~/.ssh/known_hosts:/home/aiida/.ssh/known_hosts:ro
